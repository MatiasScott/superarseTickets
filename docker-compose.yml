services:
  superar1_iststicket:
    build: .

    container_name: superar1_iststicket

    restart: unless-stopped

    ports:
      - "8086:80"

    env_file:
      - .env

    volumes:
      - ./storage:/var/www/html/storage
      - ./public/cci-attachments:/var/www/html/public/cci-attachments

    networks:
      - moodle_net

networks:
  moodle_net:
    external: true
