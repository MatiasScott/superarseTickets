version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: atlas_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: atlas_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - TZ=America/Guayaquil
      - N8N_HOST=192.168.40.81
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=change_me_n8n_key
      - N8N_EDITOR_BASE_URL=http://192.168.40.81:5678
      - WEBHOOK_URL=http://192.168.40.81:5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - redis

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: atlas_uptime_kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

  portainer:
    image: portainer/portainer-ce:latest
    container_name: atlas_portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  redis_data:
  n8n_data:
  uptime_kuma_data:
  portainer_data:
